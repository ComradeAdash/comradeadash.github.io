name: 'Deploy Website'

# Trigger Configuration
on:
  push:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build Job - this compiles the TypeScript code and prepares it for deployment
  build:
    name: 'Build'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v5
      - name: 'Setup Node'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: 'Build Website'
        run: npm ci && npm run build
      - name: 'Prepare Pages artifact'
        run: |
          mkdir -p site/src site/assets site/dist
          cp index.html site/index.html
          cp src/style.css src/fonts.css site/src/
          cp -r assets/. site/assets/
          cp dist/index.js site/dist/index.js
      - name: 'Upload artifact'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
  # Deploy Job
  deploy:
    name: 'Deploy'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 'Deploy to GitHub Pages'
        id: deployment
        uses: actions/deploy-pages@v4